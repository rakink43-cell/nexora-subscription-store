name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Migration bundle, types, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SQL migration bundle
        run: npm run verify:migrations

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint
